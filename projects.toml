# Projects to check, as GitHub "owner/name", in groups. The report shows groups
# and the projects in them in this order.
#
# Groups other than "Others" were initially filled on 2026-10-09 with their
# main projects and the dependencies of those (including scrapy-zyte-api's
# "provider" extra) not in earlier groups. Move projects between groups freely.

[[groups]]
title = "Scrapy and its deps"
repos = [
    "scrapy/scrapy",
    "scrapy/cssselect",
    "scrapy/formerly",
    "scrapy/itemadapter",
    "scrapy/itemloaders",
    "scrapy/parsel",
    "scrapy/protego",
    "scrapy/queuelib",
    "scrapy/w3lib",
    "scrapy/sphinx-scrapy",
    "scrapy/sphinx-llm-friendly",
]

[[groups]]
title = "scrapy-poet and its deps"
repos = [
    "scrapinghub/scrapy-poet",
    "scrapinghub/andi",
    "scrapinghub/web-poet",
    "zytedata/url-matcher",
]

[[groups]]
title = "Zyte API"
repos = [
    "scrapy-plugins/scrapy-zyte-api",
    "zytedata/python-zyte-api",
    "scrapy-plugins/scrapy-zyte-smartproxy",
    "zytedata/zyte-common-items",
    "zytedata/zyte-parsers",
    "zytedata/clear-html",
    "zytedata/html-text",
    "scrapinghub/price-parser",
]

[[groups]]
title = "Scrapy Cloud"
repos = [
    "scrapinghub/python-scrapinghub",
    "scrapinghub/shub",
    "scrapinghub/scrapinghub-entrypoint-scrapy",
]

[[groups]]
title = "Others"
repos = [
    "scrapy/form2request",
    "scrapy/frostwork",
    "scrapy/scrapy-agent-plugin",
    "scrapy/scrapy-lint",
    "scrapy/scrapy-mcp-official",
    "scrapy/unattended-pr-guard",
    "scrapy/xtractmime",
    "scrapy-plugins/scrapy-download-handlers-incubator",
    "scrapy-plugins/scrapy-playwright",
    "scrapy-plugins/scrapy-spider-metadata",
    "scrapy-plugins/zyte-spidermon",
    "scrapinghub/dateparser",
    "scrapinghub/extruct",
    "scrapinghub/number-parser",
    "scrapinghub/scrapyrt",
    "scrapinghub/spidermon",
    "zytedata/agent-exam",
    "zytedata/claude-measure-usage",
    "zytedata/duplicate-url-discarder",
    "zytedata/harness-run",
]

# Checks that do not apply to a project, with the reason. They are reported as
# "not applicable" instead of being run:
#
# [skip."owner/name"]
# check-id = "Reason."

[skip."scrapy/frostwork"]
hatchling = "Rust extension, built with maturin."
twine-check = "Wheels are built per platform by maturin in CI, where twine check runs on them."

[skip."scrapy/scrapy-agent-plugin"]
python = "Agent plugin, not a Python package."
packaging = "Agent plugin, not a Python package."
dependencies = "Agent plugin, not a Python package."
typing = "Agent plugin, not a Python package."
tests = "Agent plugin, has no code to test."
ruff = "Agent plugin, has no Python code."
pylint = "Agent plugin, has no Python code."
trusted-publishing = "Agent plugin, not published to PyPI."
publish-on-tag = "Agent plugin, not published to PyPI."
separate-build-job = "Agent plugin, not published to PyPI."

[skip."scrapy/unattended-pr-guard"]
python = "JavaScript GitHub Action."
