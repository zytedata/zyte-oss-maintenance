# Calls the central reusable workflow in the governance repo. This file may live
# in service repos, but it cannot weaken the scan: the logic is centralized in
# <org>/governance and, on production repos, the org ruleset requires the
# "secrets / detect-secrets" check to pass. Renaming the job here only makes the
# required check go missing, which still blocks the PR.
#
# On NON-production repos there is no merge gate — direct pushes to main are
# allowed. That is exactly why this runs on every push to every branch: detection
# coverage is broader than the old pull-request-only trigger, and a finding raises
# an InfoSec issue + a Slack alert automatically (see the webhook service).
#
# zytedata is substituted at publish/backfill time. `uses:` must be a
# literal — GitHub does not expand expressions there — so the org cannot be a
# variable and each org gets its own rendered copy pointing at its OWN governance
# repo. Cross-org reusable-workflow references are not usable here.
name: secrets

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs for the same ref: PoC branches push often, and only the
# newest commit's result is meaningful. Push refs (refs/heads/*) and PR refs
# (refs/pull/*/merge) land in different groups, so this never cancels the run that
# a production PR's required check is waiting on.
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job id "secrets" + reusable job "detect-secrets" => check context
  # "secrets / detect-secrets" (this is what Ruleset B requires).
  secrets:
    uses: zytedata/governance/.github/workflows/detect-secrets.yml@main
